<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rahro Panel</title>
<style>
  :root{
    --bg:#0b1220; --bg2:#0f172a; --surface:#141e32; --surface2:#1b2742;
    --border:#223354; --text:#e6edf6; --dim:#8d9bb5; --accent:#2dd4bf; --accent2:#60a5fa;
    --ok:#34d399; --warn:#fbbf24; --bad:#f87171;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px}
  a{color:var(--accent2)}
  button{cursor:pointer;font-family:inherit}
  input,select{font-family:inherit}
  .hidden{display:none !important}
  .btn{background:linear-gradient(90deg,var(--accent),var(--accent2));border:none;border-radius:9px;padding:9px 16px;color:#07101f;font-weight:700;font-size:13px}
  .btn-ghost{background:#1b2742;border:1px solid var(--border);color:#cdd8ea;border-radius:8px;padding:8px 13px;font-size:12px;font-weight:600}
  .btn-danger{background:#3a1414;border:1px solid #5a2222;color:#f87171;border-radius:8px;padding:6px 11px;font-size:12px}
  .in{background:#0c1526;border:1px solid #2a3a5a;border-radius:9px;padding:10px 12px;color:var(--text);font-size:13px;width:100%}
  label{display:block;font-size:12px;color:var(--dim);margin:0 0 6px}
  /* login */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(1100px 600px at 50% -10%,#16233f,#0b1220 60%)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px}
  #login .card{width:360px}
  .logo{display:flex;align-items:center;gap:10px;margin-bottom:18px}
  .logo b{font-size:17px}
  /* app layout */
  #app{display:flex;min-height:100vh}
  aside{width:230px;background:var(--bg2);border-right:1px solid #1f2a40;padding:20px 14px;display:flex;flex-direction:column;gap:6px;flex-shrink:0}
  nav a{display:block;padding:10px 12px;border-radius:9px;color:var(--dim);text-decoration:none;cursor:pointer}
  nav a.active{background:#15223c;color:var(--text);font-weight:600}
  main{flex:1;min-width:0;display:flex;flex-direction:column}
  header{height:60px;border-bottom:1px solid #1f2a40;display:flex;align-items:center;justify-content:space-between;padding:0 24px}
  .content{padding:22px 24px;display:flex;flex-direction:column;gap:16px}
  .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:15px 17px}
  .stat .n{font-size:26px;font-weight:700;margin-top:5px}
  table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
  th,td{text-align:left;padding:11px 14px;font-size:13px;border-bottom:1px solid #1b2742}
  th{color:var(--dim);font-weight:500;background:#121b2e}
  tr:last-child td{border-bottom:none}
  .badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px}
  .b-ok{background:#10362b;color:var(--ok)} .b-bad{background:#3a1414;color:var(--bad)} .b-warn{background:#3a2a10;color:var(--warn)}
  .row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
  .row>div{flex:1;min-width:120px}
  .mono{font-family:ui-monospace,monospace;font-size:12px;color:var(--dim)}
  .toast{position:fixed;bottom:18px;right:18px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 16px;max-width:420px}
  @media(max-width:720px){#app{flex-direction:column}aside{width:auto;flex-direction:row;overflow:auto}.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<div id="login">
  <div class="card">
    <div class="logo">
      <svg width="34" height="34" viewBox="0 0 32 32" fill="none"><rect x="1" y="1" width="30" height="30" rx="9" fill="#0b1220" stroke="#2dd4bf" stroke-width="1.5"/><path d="M8 20c3-9 13-9 16 0" stroke="#2dd4bf" stroke-width="2.2" stroke-linecap="round"/><circle cx="16" cy="13.5" r="2.6" fill="#60a5fa"/></svg>
      <div><b>Rahro</b><div style="font-size:11px;color:var(--dim)">tunnel panel</div></div>
    </div>
    <label>Username</label><input id="lu" class="in" value="admin" style="margin-bottom:12px">
    <label>Password</label><input id="lp" class="in" type="password" style="margin-bottom:16px">
    <button class="btn" style="width:100%" onclick="login()">Sign in</button>
    <div id="lerr" style="color:var(--bad);font-size:12px;margin-top:10px"></div>
  </div>
</div>

<div id="app" class="hidden">
  <aside>
    <div class="logo" style="padding:0 8px 8px"><svg width="28" height="28" viewBox="0 0 32 32" fill="none"><rect x="1" y="1" width="30" height="30" rx="9" fill="#0b1220" stroke="#2dd4bf" stroke-width="1.5"/><path d="M8 20c3-9 13-9 16 0" stroke="#2dd4bf" stroke-width="2.2" stroke-linecap="round"/><circle cx="16" cy="13.5" r="2.6" fill="#60a5fa"/></svg><b>Rahro</b></div>
    <nav>
      <a data-view="dash" class="active" onclick="show('dash')">Dashboard</a>
      <a data-view="users" onclick="show('users')">Users</a>
      <a data-view="nodes" onclick="show('nodes')">Nodes &amp; tunnels</a>
      <a data-view="tokens" onclick="show('tokens')">API tokens</a>
      <a data-view="settings" onclick="show('settings')">Settings</a>
    </nav>
    <div style="margin-top:auto"><button class="btn-ghost" style="width:100%" onclick="logout()">Sign out</button></div>
  </aside>
  <main>
    <header><div id="title" style="font-size:17px;font-weight:600">Dashboard</div><div id="who" class="mono"></div></header>
    <div class="content" id="content"></div>
  </main>
</div>

<div id="toast" class="toast hidden"></div>

<script>
const $=s=>document.querySelector(s);
let state={users:[],nodes:[],tokens:[],stats:{}};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),3500)}
async function api(method,path,body){
  const o={method,headers:{}};
  if(body){o.headers['Content-Type']='application/json';o.body=JSON.stringify(body)}
  const r=await fetch(path,o);
  if(r.status===401){showLogin();throw new Error('unauthorized')}
  const t=await r.text();
  const j=t?JSON.parse(t):{};
  if(!r.ok)throw new Error(j.error||('HTTP '+r.status));
  return j;
}
function showLogin(){$('#login').classList.remove('hidden');$('#app').classList.add('hidden')}
async function login(){
  try{const u=$('#lu').value,p=$('#lp').value;
    await api('POST','/api/login',{username:u,password:p});
    $('#login').classList.add('hidden');$('#app').classList.remove('hidden');
    $('#who').textContent=u;show('dash');
  }catch(e){$('#lerr').textContent='Invalid credentials'}
}
async function logout(){try{await api('POST','/api/logout')}catch(e){};showLogin()}
function show(v){
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.dataset.view===v));
  $('#title').textContent={dash:'Dashboard',users:'Users',nodes:'Nodes & tunnels',tokens:'API tokens',settings:'Settings'}[v];
  ({dash:renderDash,users:renderUsers,nodes:renderNodes,tokens:renderTokens,settings:renderSettings}[v])();
}
const gb=n=>n?(n/1073741824).toFixed(0)+' GB':'∞';
const when=t=>t?new Date(t*1000).toISOString().slice(0,10):'—';

async function renderDash(){
  const s=await api('GET','/api/stats');
  $('#content').innerHTML=`<div class="grid">
    <div class="stat"><div style="color:var(--dim)">Users</div><div class="n">${s.users}</div></div>
    <div class="stat"><div style="color:var(--dim)">Active users</div><div class="n">${s.active_users}</div></div>
    <div class="stat"><div style="color:var(--dim)">Nodes</div><div class="n">${s.nodes}</div></div>
    <div class="stat"><div style="color:var(--dim)">Nodes enabled</div><div class="n">${s.nodes_enabled}</div></div>
  </div>
  <div class="card">Welcome to the Rahro panel. Use the sidebar to manage users, nodes/tunnels, and API tokens for your Telegram sales bot.</div>`;
}
async function renderUsers(){
  const u=await api('GET','/api/users');
  let rows=u.map(x=>`<tr>
    <td><b>${esc(x.username)}</b><div class="mono">${x.uuid.slice(0,12)}…</div></td>
    <td>${gb(x.used_bytes)} / ${gb(x.quota_bytes)}</td>
    <td>${when(x.expires_at)}</td>
    <td>${x.active?'<span class="badge b-ok">active</span>':'<span class="badge b-bad">inactive</span>'}</td>
    <td><button class="btn-ghost" onclick="copySub('${x.sub_token}')">sub</button>
        <button class="btn-danger" onclick="delUser(${x.id})">del</button></td></tr>`).join('');
  $('#content').innerHTML=`<div class="card"><div class="row">
      <div><label>Username</label><input id="nu" class="in"></div>
      <div><label>Quota (GB, 0=∞)</label><input id="nq" class="in" type="number" value="100"></div>
      <div><label>Days (0=never)</label><input id="nd" class="in" type="number" value="30"></div>
      <div style="flex:0"><button class="btn" onclick="addUser()">+ Add user</button></div>
    </div></div>
    <table><thead><tr><th>User</th><th>Usage</th><th>Expiry</th><th>Status</th><th></th></tr></thead>
    <tbody>${rows||'<tr><td colspan=5 style="color:var(--dim)">No users yet</td></tr>'}</tbody></table>`;
}
async function addUser(){try{
  await api('POST','/api/users',{username:$('#nu').value,quota_gb:+$('#nq').value,days:+$('#nd').value});
  renderUsers();toast('User created');
}catch(e){toast(e.message)}}
async function delUser(id){if(!confirm('Delete user?'))return;await api('DELETE','/api/users/'+id);renderUsers()}
function copySub(tok){const url=location.origin+'/sub/'+tok;navigator.clipboard?.writeText(url);toast('Subscription link copied: '+url)}

async function renderNodes(){
  const n=await api('GET','/api/nodes');
  let rows=n.map(x=>`<tr>
    <td><b>${esc(x.name)}</b><div class="mono">${esc(x.location||'')}</div></td>
    <td>${x.role}</td><td class="mono">${esc(x.address||'—')}</td>
    <td>${esc(x.serving_mode)}</td>
    <td>${x.enabled?'<span class="badge b-ok">enabled</span>':'<span class="badge b-bad">disabled</span>'}</td>
    <td><button class="btn-danger" onclick="delNode(${x.id})">del</button></td></tr>`).join('');
  $('#content').innerHTML=`<div class="card"><div class="row">
      <div><label>Name</label><input id="nn" class="in" placeholder="nl-ams-01"></div>
      <div><label>Role</label><select id="nr" class="in"><option value="location">location (egress)</option><option value="tunnel">tunnel (Iran relay)</option><option value="panel">panel</option></select></div>
      <div><label>Location</label><input id="nl" class="in" placeholder="NL"></div>
      <div><label>Address (host:port)</label><input id="na" class="in" placeholder="nl.example.com:443"></div>
      <div><label>Serving mode</label><select id="nm" class="in"><option value="both">both</option><option value="standard">standard</option><option value="rahro">rahro</option></select></div>
      <div style="flex:0"><button class="btn" onclick="addNode()">+ Add node</button></div>
    </div></div>
    <table><thead><tr><th>Node</th><th>Role</th><th>Address</th><th>Mode</th><th>Status</th><th></th></tr></thead>
    <tbody>${rows||'<tr><td colspan=6 style="color:var(--dim)">No nodes yet</td></tr>'}</tbody></table>`;
}
async function addNode(){try{
  const r=await api('POST','/api/nodes',{name:$('#nn').value,role:$('#nr').value,location:$('#nl').value,address:$('#na').value,serving_mode:$('#nm').value});
  renderNodes();
  prompt('Run this on the node server to enroll it:',r.enroll_command||r.connection_code);
}catch(e){toast(e.message)}}
async function delNode(id){if(!confirm('Delete node?'))return;await api('DELETE','/api/nodes/'+id);renderNodes()}

async function renderTokens(){
  const t=await api('GET','/api/tokens');
  let rows=t.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td class="mono">${esc(x.scopes)}</td><td>${when(x.created_at)}</td>
     <td><button class="btn-danger" onclick="delToken(${x.id})">del</button></td></tr>`).join('');
  $('#content').innerHTML=`<div class="card">
      <div style="margin-bottom:10px;color:var(--dim)">Tokens let an external Telegram sales bot call the panel API (create/renew users, read usage).</div>
      <div class="row"><div><label>Token name</label><input id="tn" class="in" placeholder="telegram-sales-bot"></div>
      <div style="flex:0"><button class="btn" onclick="addToken()">+ Create token</button></div></div></div>
    <table><thead><tr><th>Name</th><th>Scopes</th><th>Created</th><th></th></tr></thead>
    <tbody>${rows||'<tr><td colspan=4 style="color:var(--dim)">No tokens yet</td></tr>'}</tbody></table>`;
}
async function addToken(){try{
  const r=await api('POST','/api/tokens',{name:$('#tn').value||'bot'});
  renderTokens();
  prompt('Copy this token now — it is shown only once:',r.secret);
}catch(e){toast(e.message)}}
async function delToken(id){if(!confirm('Delete token?'))return;await api('DELETE','/api/tokens/'+id);renderTokens()}

function renderSettings(){
  $('#content').innerHTML=`<div class="card" style="max-width:520px">
      <div style="font-size:14px;font-weight:600;margin-bottom:4px">Admin account</div>
      <div style="color:var(--dim);font-size:12px;margin-bottom:14px">Change your panel username and password. Your current password is required.</div>
      <label>Current password</label><input id="cp" class="in" type="password" style="margin-bottom:12px">
      <label>New username (optional)</label><input id="nus" class="in" placeholder="leave blank to keep" style="margin-bottom:12px">
      <label>New password (optional, min 6)</label><input id="nps" class="in" type="password" placeholder="leave blank to keep" style="margin-bottom:16px">
      <button class="btn" onclick="changeAccount()">Save changes</button>
      <div id="serr" style="font-size:12px;margin-top:10px"></div>
    </div>`;
}
async function changeAccount(){
  const body={current_password:$('#cp').value,new_username:$('#nus').value,new_password:$('#nps').value};
  try{
    const r=await api('POST','/api/account',body);
    $('#who').textContent=r.username;
    $('#serr').style.color='var(--ok)';$('#serr').textContent='Saved. Username is now "'+r.username+'".';
    $('#cp').value='';$('#nus').value='';$('#nps').value='';
  }catch(e){$('#serr').style.color='var(--bad)';$('#serr').textContent=e.message}
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

// Auto-enter the app if already authenticated.
(async()=>{try{const m=await api('GET','/api/me');$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#who').textContent=m.username;show('dash')}catch(e){showLogin()}})();
</script>
</body>
</html>
