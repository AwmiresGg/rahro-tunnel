<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rahro Panel</title>
<style>
  :root{
    --bg:#0b1220; --bg2:#0f172a; --surface:#141e32; --surface2:#1b2742;
    --border:#223354; --text:#e6edf6; --dim:#8d9bb5; --accent:#2dd4bf; --accent2:#60a5fa;
    --ok:#34d399; --warn:#fbbf24; --bad:#f87171;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px}
  a{color:var(--accent2)}
  button{cursor:pointer;font-family:inherit}
  input,select{font-family:inherit}
  .hidden{display:none !important}
  .btn{background:linear-gradient(90deg,var(--accent),var(--accent2));border:none;border-radius:9px;padding:9px 16px;color:#07101f;font-weight:700;font-size:13px}
  .btn-ghost{background:#1b2742;border:1px solid var(--border);color:#cdd8ea;border-radius:8px;padding:8px 13px;font-size:12px;font-weight:600}
  .btn-danger{background:#3a1414;border:1px solid #5a2222;color:#f87171;border-radius:8px;padding:6px 11px;font-size:12px}
  .in{background:#0c1526;border:1px solid #2a3a5a;border-radius:9px;padding:10px 12px;color:var(--text);font-size:13px;width:100%}
  label{display:block;font-size:12px;color:var(--dim);margin:0 0 6px}
  /* login */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(1100px 600px at 50% -10%,#16233f,#0b1220 60%)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px}
  #login .card{width:360px}
  .logo{display:flex;align-items:center;gap:10px;margin-bottom:18px}
  .logo b{font-size:17px}
  /* app layout */
  #app{display:flex;min-height:100vh}
  aside{width:230px;background:var(--bg2);border-right:1px solid #1f2a40;padding:20px 14px;display:flex;flex-direction:column;gap:6px;flex-shrink:0}
  nav a{display:block;padding:10px 12px;border-radius:9px;color:var(--dim);text-decoration:none;cursor:pointer}
  nav a.active{background:#15223c;color:var(--text);font-weight:600}
  main{flex:1;min-width:0;display:flex;flex-direction:column}
  header{height:60px;border-bottom:1px solid #1f2a40;display:flex;align-items:center;justify-content:space-between;padding:0 24px}
  .content{padding:22px 24px;display:flex;flex-direction:column;gap:16px}
  .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:15px 17px}
  .stat .n{font-size:26px;font-weight:700;margin-top:5px}
  table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
  th,td{text-align:left;padding:11px 14px;font-size:13px;border-bottom:1px solid #1b2742}
  th{color:var(--dim);font-weight:500;background:#121b2e}
  tr:last-child td{border-bottom:none}
  .badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px}
  .b-ok{background:#10362b;color:var(--ok)} .b-bad{background:#3a1414;color:var(--bad)} .b-warn{background:#3a2a10;color:var(--warn)}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;padding:24px;z-index:50;overflow:auto}
  .modal-box{background:var(--card,#121a2e);border:1px solid var(--border);border-radius:14px;max-width:620px;width:100%;padding:18px}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .lk{border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .lk .lkhead{display:flex;justify-content:space-between;align-items:center;width:100%}
  .lk .lktext{flex:1;min-width:0;word-break:break-all;font-size:11px;color:var(--dim)}
  .lk .qr{width:104px;height:104px;background:#fff;padding:5px;border-radius:8px;flex:0 0 auto}
  .row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
  .row>div{flex:1;min-width:120px}
  .mono{font-family:ui-monospace,monospace;font-size:12px;color:var(--dim)}
  .toast{position:fixed;bottom:18px;right:18px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 16px;max-width:420px}
  @media(max-width:720px){#app{flex-direction:column}aside{width:auto;flex-direction:row;overflow:auto}.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<div id="login">
  <div class="card">
    <div class="logo">
      <svg width="34" height="34" viewBox="0 0 32 32" fill="none"><rect x="1" y="1" width="30" height="30" rx="9" fill="#0b1220" stroke="#2dd4bf" stroke-width="1.5"/><path d="M8 20c3-9 13-9 16 0" stroke="#2dd4bf" stroke-width="2.2" stroke-linecap="round"/><circle cx="16" cy="13.5" r="2.6" fill="#60a5fa"/></svg>
      <div><b>Rahro</b><div style="font-size:11px;color:var(--dim)">tunnel panel</div></div>
    </div>
    <label>Username</label><input id="lu" class="in" value="admin" style="margin-bottom:12px">
    <label>Password</label><input id="lp" class="in" type="password" style="margin-bottom:16px">
    <button class="btn" style="width:100%" onclick="login()">Sign in</button>
    <div id="lerr" style="color:var(--bad);font-size:12px;margin-top:10px"></div>
  </div>
</div>

<div id="app" class="hidden">
  <aside>
    <div class="logo" style="padding:0 8px 8px"><svg width="28" height="28" viewBox="0 0 32 32" fill="none"><rect x="1" y="1" width="30" height="30" rx="9" fill="#0b1220" stroke="#2dd4bf" stroke-width="1.5"/><path d="M8 20c3-9 13-9 16 0" stroke="#2dd4bf" stroke-width="2.2" stroke-linecap="round"/><circle cx="16" cy="13.5" r="2.6" fill="#60a5fa"/></svg><b>Rahro</b></div>
    <nav>
      <a data-view="dash" class="active" onclick="show('dash')">Dashboard</a>
      <a data-view="users" onclick="show('users')">Users</a>
      <a data-view="inbounds" onclick="show('inbounds')">Inbounds</a>
      <a data-view="nodes" onclick="show('nodes')">Nodes &amp; tunnels</a>
      <a data-view="tokens" onclick="show('tokens')">API tokens</a>
      <a data-view="settings" onclick="show('settings')">Settings</a>
    </nav>
    <div style="margin-top:auto"><button class="btn-ghost" style="width:100%" onclick="logout()">Sign out</button></div>
  </aside>
  <main>
    <header><div id="title" style="font-size:17px;font-weight:600">Dashboard</div><div id="who" class="mono"></div></header>
    <div class="content" id="content"></div>
  </main>
</div>

<div id="toast" class="toast hidden"></div>

<script>
const $=s=>document.querySelector(s);
let state={users:[],nodes:[],tokens:[],stats:{}};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),3500)}
async function api(method,path,body){
  const o={method,headers:{}};
  if(body){o.headers['Content-Type']='application/json';o.body=JSON.stringify(body)}
  const r=await fetch(path,o);
  if(r.status===401){showLogin();throw new Error('unauthorized')}
  const t=await r.text();
  const j=t?JSON.parse(t):{};
  if(!r.ok)throw new Error(j.error||('HTTP '+r.status));
  return j;
}
function showLogin(){$('#login').classList.remove('hidden');$('#app').classList.add('hidden')}
async function login(){
  try{const u=$('#lu').value,p=$('#lp').value;
    await api('POST','/api/login',{username:u,password:p});
    $('#login').classList.add('hidden');$('#app').classList.remove('hidden');
    $('#who').textContent=u;show('dash');
  }catch(e){$('#lerr').textContent='Invalid credentials'}
}
async function logout(){try{await api('POST','/api/logout')}catch(e){};showLogin()}
function show(v){
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.dataset.view===v));
  $('#title').textContent={dash:'Dashboard',users:'Users',inbounds:'Inbounds',nodes:'Nodes & tunnels',tokens:'API tokens',settings:'Settings'}[v];
  ({dash:renderDash,users:renderUsers,inbounds:renderInbounds,nodes:renderNodes,tokens:renderTokens,settings:renderSettings}[v])();
}
const gb=n=>{if(!n)return '∞';const g=n/1073741824;if(g>=10)return g.toFixed(0)+' GB';if(g>=0.1)return g.toFixed(1)+' GB';const m=n/1048576;return (m>=1?m.toFixed(0)+' MB':(n/1024).toFixed(0)+' KB')};
const used=n=>{const g=n/1073741824;if(g>=1)return g.toFixed(2)+' GB';const m=n/1048576;return m>=1?m.toFixed(1)+' MB':(n/1024).toFixed(0)+' KB'};
const when=t=>t?new Date(t*1000).toISOString().slice(0,10):'—';
const pct=(u,t)=>t>0?Math.min(100,Math.round(u/t*100)):0;
const uptime=s=>{if(!s)return '—';const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return (d?d+'d ':'')+(h?h+'h ':'')+m+'m'};
function bar(label,u,t,val){const p=pct(u,t);const col=p>=90?'var(--bad)':p>=70?'var(--warn)':'var(--ok)';
  return `<div style="margin:8px 0"><div style="display:flex;justify-content:space-between;font-size:12px"><span style="color:var(--dim)">${label}</span><span class="mono">${val}</span></div>
    <div style="height:7px;border-radius:4px;background:rgba(127,127,127,.18);margin-top:4px;overflow:hidden"><div style="height:100%;width:${p}%;background:${col}"></div></div></div>`}

async function renderDash(){
  const s=await api('GET','/api/stats');
  let xr={}; try{xr=await api('GET','/api/xray/status')}catch(e){}
  let sys=null; try{sys=await api('GET','/api/system')}catch(e){}
  const xstate = !xr.enabled?'<span class="badge b-bad">off</span>'
    : xr.running?'<span class="badge b-ok">running</span>'
    : xr.installed?'<span class="badge b-warn">installed, idle</span>'
    : '<span class="badge b-warn">downloading…</span>';
  const xver = xr.version?('<div class="mono" style="margin-top:6px">'+esc(xr.version)+'</div>'):'';
  let sysCard='';
  if(sys){
    sysCard=`<div class="card"><div style="font-weight:600;margin-bottom:6px">Server status
      <span class="mono" style="color:var(--dim);font-weight:400;margin-left:8px">${esc(sys.os)}/${esc(sys.arch)} · ${sys.cpu_count} CPU · up ${uptime(sys.uptime_sec)} · load ${sys.load1}</span></div>
      ${bar('CPU',sys.cpu_percent,100,sys.cpu_percent+'%')}
      ${bar('Memory',sys.mem_used,sys.mem_total,used(sys.mem_used)+' / '+used(sys.mem_total))}
      ${sys.disk_total?bar('Disk',sys.disk_used,sys.disk_total,used(sys.disk_used)+' / '+used(sys.disk_total)):''}
      ${sys.swap_total?bar('Swap',sys.swap_used,sys.swap_total,used(sys.swap_used)+' / '+used(sys.swap_total)):''}
    </div>`;
  }
  $('#content').innerHTML=`<div class="grid">
    <div class="stat"><div style="color:var(--dim)">Users</div><div class="n">${s.users}</div></div>
    <div class="stat"><div style="color:var(--dim)">Active users</div><div class="n">${s.active_users}</div></div>
    <div class="stat"><div style="color:var(--dim)">Nodes</div><div class="n">${s.nodes}</div></div>
    <div class="stat"><div style="color:var(--dim)">Nodes enabled</div><div class="n">${s.nodes_enabled}</div></div>
  </div>
  <div class="card" style="display:flex;align-items:center;gap:12px">
    <div style="font-weight:600">Xray core</div> ${xstate}
    <button class="btn-ghost" onclick="runDiag()">🩺 Diagnose connection</button>
    <button class="btn-ghost" onclick="showXrayLog()">📜 Xray log</button>
    <button class="btn-ghost" onclick="toggleDebug()">🐞 Debug log</button>
    <button class="btn-ghost" style="margin-left:auto" onclick="xrayApply()">Apply / restart</button>
  </div>${xver?('<div class="card">'+xver+'</div>'):''}
  <div id="diag"></div>
  ${sysCard}
  <div class="card">Manage users, inbounds (served by Xray), nodes/tunnels, and API tokens from the sidebar. Changes to inbounds or users apply to Xray automatically.</div>`;
}
async function xrayApply(){try{const r=await api('POST','/api/xray/apply');toast(r.error?('Apply error: '+r.error):'Xray reloaded');renderDash()}catch(e){toast(e.message)}}
async function toggleDebug(){
  try{const r=await api('POST','/api/xray/debug');
    toast(r.loglevel==='debug'?'Debug logging ON — connect from your phone, then open Xray log. Turn OFF when done.':'Debug logging OFF (back to normal).');
  }catch(e){toast(e.message)}
}
async function showXrayLog(){
  let e=null,a=null;
  try{e=await api('GET','/api/xray/log')}catch(x){}
  try{a=await api('GET','/api/xray/log?access=1')}catch(x){}
  const box=s=>`<pre style="white-space:pre-wrap;word-break:break-all;background:#0b1120;border:1px solid var(--border);border-radius:8px;padding:10px;font-size:11px;max-height:240px;overflow:auto">${esc(s||'(empty)')}</pre>`;
  openModal('Xray log (connect from your client, then reopen this)',
    '<div style="font-size:12px;color:var(--dim);margin-bottom:6px">Error log (REALITY / startup):</div>'+box(e&&e.log)+
    '<div style="font-size:12px;color:var(--dim);margin:10px 0 6px">Access log (accepted connections):</div>'+box(a&&a.log)+
    '<div style="font-size:11px;color:var(--dim);margin-top:8px">Try connecting in v2rayNG now, then reopen this. “REALITY: processed invalid connection” = key mismatch (click Apply/restart). An “accepted … email:” line = it connected. Nothing new = the connection never reached the server (port/firewall).</div>');
}
async function runDiag(){
  const el=$('#diag'); el.innerHTML='<div class="card">Running checks…</div>';
  let d; try{d=await api('GET','/api/diag')}catch(e){el.innerHTML='';return toast(e.message)}
  const yn=v=>v?'<span class="badge b-ok">OK</span>':'<span class="badge b-bad">FAIL</span>';
  let h='<div class="card"><div style="font-weight:600;margin-bottom:8px">Connection diagnostics</div>';
  h+=`<div style="margin:4px 0">Xray installed ${yn(d.xray.installed)} · running ${yn(d.xray.running)}</div>`;
  h+=`<div style="margin:4px 0">Link host: <span class="mono">${esc(d.public_host||'?')}</span></div>`;
  (d.inbounds||[]).forEach(i=>{const km=(i.keys_match_running===undefined)?'':` · keys match running ${yn(i.keys_match_running)}`;h+=`<div style="margin:4px 0">Inbound <b>${esc(i.tag)}</b> :${i.port} (${esc(i.security)}) — port listening ${yn(i.listening)}${km}</div>`});
  (d.reality_dests||[]).forEach(x=>{h+=`<div style="margin:4px 0">REALITY dest <span class="mono">${esc(x.dest)}</span> reachable ${yn(x.reachable)}</div>`});
  if(d.stale_keys) h+='<div style="color:var(--bad);font-size:13px;margin-top:8px"><b>⚠ The running Xray config is STALE</b> — its REALITY keys don\'t match the panel. Click <b>Apply / restart</b> above, then re-copy the config link. This is the usual cause of "received real certificate" / configs not connecting.</div>';
  if(!d.xray.running) h+='<div style="color:var(--warn);font-size:12px;margin-top:8px">Xray is not running — inbounds will not serve. If it says "downloading…", the server can\'t reach GitHub to fetch Xray.</div>';
  const anyDown=(d.inbounds||[]).some(i=>!i.listening);
  if(anyDown) h+='<div style="color:var(--warn);font-size:12px;margin-top:8px">A port is not listening. Check the inbound\'s port isn\'t already in use, and open it in the server/cloud firewall.</div>';
  h+='<div style="color:var(--dim);font-size:11px;margin-top:8px">Note: if you use a domain behind Cloudflare, set the DNS record to <b>DNS-only (grey cloud)</b> — REALITY/TLS tunnels break when proxied (orange cloud).</div>';
  h+='</div>'; el.innerHTML=h;
}
async function renderUsers(){
  const u=await api('GET','/api/users');
  let on={}; try{on=await api('GET','/api/onlines')}catch(e){}
  let ins=[]; try{ins=await api('GET','/api/inbounds')}catch(e){}
  const enIns=ins.filter(i=>i.enabled);
  let rows=u.map(x=>{
    const o=on[x.username], ips=o?o.ips:[], online=o?o.online:0;
    const dot=online>0?`<span class="badge b-ok" title="${esc(ips.join(', '))}">● ${online} online</span>`
      : ips.length?`<span class="badge b-warn" title="${esc(ips.join(', '))}">${ips.length} IP</span>`:'';
    const lim=x.ip_limit>0?`<div class="mono" style="color:var(--dim)">IP≤${x.ip_limit}</div>`:'';
    const cyc=x.reset_days>0?`<div class="mono" style="color:var(--dim)">↻${x.reset_days}d</div>`:'';
    const ib=x.inbound_tags?esc(x.inbound_tags):'<span style="color:var(--dim)">all</span>';
    return `<tr>
    <td><b>${esc(x.username)}</b><div class="mono">${x.uuid.slice(0,12)}…</div></td>
    <td>${used(x.used_bytes)} / ${gb(x.quota_bytes)}${cyc}</td>
    <td class="mono" style="font-size:12px">${ib}</td>
    <td>${when(x.expires_at)}${lim}</td>
    <td>${x.active?'<span class="badge b-ok">active</span>':'<span class="badge b-bad">inactive</span>'} ${dot}</td>
    <td><button class="btn-ghost" onclick="showLinks(${x.id})" title="Configs & QR codes">config</button>
        <button class="btn-ghost" onclick="copySub('${x.sub_token}')">sub</button>
        <button class="btn-ghost" onclick="resetUser(${x.id})" title="Reset used traffic">↻</button>
        <button class="btn-danger" onclick="delUser(${x.id})">del</button></td></tr>`}).join('');
  const ibChecks=enIns.length
    ? enIns.map(i=>`<label style="display:inline-flex;align-items:center;gap:5px;margin:2px 10px 2px 0;font-weight:400"><input type="checkbox" class="ibchk" value="${esc(i.tag)}"> ${esc(i.tag)}</label>`).join('')
    : '<span style="color:var(--dim)">No enabled inbounds yet — create one in the Inbounds tab first, otherwise users have nothing to connect to.</span>';
  $('#content').innerHTML=`<div class="card"><div class="row">
      <div><label>Username</label><input id="nu" class="in"></div>
      <div><label>Quota (GB, 0=∞)</label><input id="nq" class="in" type="number" value="100"></div>
      <div><label>Days (0=never)</label><input id="nd" class="in" type="number" value="30"></div>
      <div><label>IP limit (0=∞)</label><input id="nil" class="in" type="number" value="0"></div>
      <div><label>Reset cycle (days, 0=off)</label><input id="nrd" class="in" type="number" value="0"></div>
    </div>
    <div style="margin-top:10px"><label>Inbounds (none checked = all)</label><div style="margin-top:4px">${ibChecks}</div></div>
    <div style="margin-top:10px"><button class="btn" onclick="addUser()">+ Add user</button></div>
    </div>
    <table><thead><tr><th>User</th><th>Usage</th><th>Inbounds</th><th>Expiry</th><th>Status</th><th></th></tr></thead>
    <tbody>${rows||'<tr><td colspan=6 style="color:var(--dim)">No users yet</td></tr>'}</tbody></table>`;
}
async function addUser(){try{
  if(!$('#nu').value.trim())return toast('Username is required');
  const tags=[...document.querySelectorAll('.ibchk:checked')].map(c=>c.value);
  await api('POST','/api/users',{username:$('#nu').value,quota_gb:+$('#nq').value,days:+$('#nd').value,ip_limit:+$('#nil').value,reset_days:+$('#nrd').value,inbound_tags:tags});
  renderUsers();toast('User created');
}catch(e){toast(e.message)}}
async function resetUser(id){if(!confirm('Reset this user\'s used traffic to zero?'))return;try{await api('POST','/api/users/'+id+'/reset');renderUsers();toast('Traffic reset')}catch(e){toast(e.message)}}
async function delUser(id){if(!confirm('Delete user?'))return;await api('DELETE','/api/users/'+id);renderUsers()}
function copySub(tok){const url=location.origin+'/sub/'+tok;navigator.clipboard?.writeText(url);toast('Subscription link copied: '+url)}
async function showLinks(id){
  let d; try{d=await api('GET','/api/users/'+id+'/links')}catch(e){return toast(e.message)}
  const item=(label,link)=>`<div class="lk">
     <div class="lkhead"><b>${esc(label)}</b><button class="btn-ghost" onclick="copyText(this,'${encodeURIComponent(link)}')">copy link</button></div>
     <img class="qr" src="/api/qr?text=${encodeURIComponent(link)}" alt="QR" title="Scan in your client">
     <div class="mono lktext">${esc(link)}</div>
   </div>`;
  let html=item('Subscription (all configs)',d.sub);
  html+=(d.links||[]).map(l=>item(l.tag+' · '+l.protocol,l.link)).join('');
  if(!d.links||!d.links.length) html+='<div style="color:var(--warn);font-size:13px;line-height:1.5">⚠ '+esc(d.reason||'No configs for this user.')+'</div>';
  openModal('Configs & QR codes',html);
}
function copyText(btn,enc){const t=decodeURIComponent(enc);navigator.clipboard?.writeText(t);const o=btn.textContent;btn.textContent='✓ copied';setTimeout(()=>btn.textContent=o,1200)}
function openModal(title,html){
  let m=document.getElementById('modal');
  if(!m){m=document.createElement('div');m.id='modal';document.body.appendChild(m);m.addEventListener('click',e=>{if(e.target===m)closeModal()})}
  m.className='modal';
  m.innerHTML=`<div class="modal-box"><div class="modal-head"><b>${esc(title)}</b><button class="btn-ghost" onclick="closeModal()">✕ close</button></div><div>${html}</div></div>`;
}
function closeModal(){const m=document.getElementById('modal');if(m){m.className='hidden';m.innerHTML=''}}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

async function renderInbounds(){
  const ins=await api('GET','/api/inbounds');
  let rows=ins.map(x=>`<tr>
    <td><b>${esc(x.tag)}</b>${x.remark?'<div class="mono">'+esc(x.remark)+'</div>':''}</td>
    <td>${esc(x.protocol)}</td><td class="mono">${x.port}</td>
    <td>${esc(x.network)} / ${esc(x.security)}</td>
    <td>${x.enabled?'<span class="badge b-ok">on</span>':'<span class="badge b-bad">off</span>'}</td>
    <td><button class="btn-danger" onclick="delInbound(${x.id})">del</button></td></tr>`).join('');
  $('#content').innerHTML=`<div class="card"><div class="row">
      <div><label>Tag</label><input id="itag" class="in" placeholder="vless-reality-443"></div>
      <div><label>Protocol</label><select id="iproto" class="in"><option value="vless">VLESS</option><option value="vmess">VMess</option><option value="trojan">Trojan</option><option value="shadowsocks">Shadowsocks</option></select></div>
      <div><label>Port</label><input id="iport" class="in" type="number" value="443"></div>
      <div><label>Network</label><select id="inet" class="in"><option>tcp</option><option>ws</option><option>grpc</option><option>http</option><option>quic</option></select></div>
      <div><label>Security</label><select id="isec" class="in"><option>reality</option><option>tls</option><option>none</option></select></div>
      <div style="flex:0"><button class="btn" onclick="addInbound()">+ Add inbound</button></div>
    </div>
    <div style="margin-top:10px"><label>Settings (JSON, optional — sni, publicKey, shortIds, serverNames, path, host, serviceName, flow, method)</label>
      <textarea id="iset" class="in" rows="2" placeholder='{"sni":"www.microsoft.com","publicKey":"...","shortIds":["ab"],"serverNames":["www.microsoft.com"],"flow":"xtls-rprx-vision"}'></textarea>
      <button class="btn-ghost" style="margin-top:8px" onclick="genReality()">🔑 Generate REALITY keys</button>
      <span id="rkeys" class="mono" style="margin-left:10px"></span></div>
    <div style="font-size:11px;color:var(--dim);margin-top:8px">Active users are offered as clients on every enabled inbound. Xray serves these; users get working share links in their subscription automatically.</div></div>
    <table><thead><tr><th>Tag</th><th>Protocol</th><th>Port</th><th>Transport</th><th>Status</th><th></th></tr></thead>
    <tbody>${rows||'<tr><td colspan=6 style="color:var(--dim)">No inbounds yet</td></tr>'}</tbody></table>`;
}
async function addInbound(){try{
  const body={tag:$('#itag').value,protocol:$('#iproto').value,port:+$('#iport').value,network:$('#inet').value,security:$('#isec').value};
  const st=$('#iset').value.trim(); if(st){try{JSON.parse(st)}catch(e){return toast('Settings is not valid JSON')} body.settings=st;}
  await api('POST','/api/inbounds',body);
  renderInbounds();toast('Inbound created');
}catch(e){toast(e.message)}}
async function genReality(){try{
  const k=await api('POST','/api/xray/reality-keys');
  $('#rkeys').innerHTML='priv: '+k.privateKey+' &nbsp; pub(pbk): '+k.publicKey;
  const cur=$('#iset').value.trim(); let o={}; if(cur){try{o=JSON.parse(cur)}catch(e){}}
  o.privateKey=k.privateKey; o.publicKey=k.publicKey;
  if(!o.shortIds)o.shortIds=[Math.random().toString(16).slice(2,10)];
  if(!o.serverNames)o.serverNames=['www.microsoft.com']; if(!o.dest)o.dest='www.microsoft.com:443';
  $('#iset').value=JSON.stringify(o);
  toast('Reality keys generated and filled into settings');
}catch(e){toast(e.message)}}
async function delInbound(id){if(!confirm('Delete inbound?'))return;await api('DELETE','/api/inbounds/'+id);renderInbounds()}

async function renderNodes(){
  const n=await api('GET','/api/nodes');
  let rows=n.map(x=>`<tr>
    <td><b>${esc(x.name)}</b><div class="mono">${esc(x.location||'')}</div></td>
    <td>${x.role}</td><td class="mono">${esc(x.address||'—')}</td>
    <td>${esc(x.serving_mode)}</td>
    <td>${x.enabled?'<span class="badge b-ok">enabled</span>':'<span class="badge b-bad">disabled</span>'}</td>
    <td><button class="btn-danger" onclick="delNode(${x.id})">del</button></td></tr>`).join('');
  $('#content').innerHTML=`<div class="card"><div class="row">
      <div><label>Name</label><input id="nn" class="in" placeholder="nl-ams-01"></div>
      <div><label>Role</label><select id="nr" class="in"><option value="location">location (egress)</option><option value="tunnel">tunnel (Iran relay)</option><option value="panel">panel</option></select></div>
      <div><label>Location</label><input id="nl" class="in" placeholder="NL"></div>
      <div><label>Address (host:port)</label><input id="na" class="in" placeholder="nl.example.com:443"></div>
      <div><label>Serving mode</label><select id="nm" class="in"><option value="both">both</option><option value="standard">standard</option><option value="rahro">rahro</option></select></div>
      <div style="flex:0"><button class="btn" onclick="addNode()">+ Add node</button></div>
    </div></div>
    <table><thead><tr><th>Node</th><th>Role</th><th>Address</th><th>Mode</th><th>Status</th><th></th></tr></thead>
    <tbody>${rows||'<tr><td colspan=6 style="color:var(--dim)">No nodes yet</td></tr>'}</tbody></table>`;
}
async function addNode(){try{
  const r=await api('POST','/api/nodes',{name:$('#nn').value,role:$('#nr').value,location:$('#nl').value,address:$('#na').value,serving_mode:$('#nm').value});
  renderNodes();
  prompt('Run this on the node server to enroll it:',r.enroll_command||r.connection_code);
}catch(e){toast(e.message)}}
async function delNode(id){if(!confirm('Delete node?'))return;await api('DELETE','/api/nodes/'+id);renderNodes()}

async function renderTokens(){
  const t=await api('GET','/api/tokens');
  let rows=t.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td class="mono">${esc(x.scopes)}</td><td>${when(x.created_at)}</td>
     <td><button class="btn-danger" onclick="delToken(${x.id})">del</button></td></tr>`).join('');
  $('#content').innerHTML=`<div class="card">
      <div style="margin-bottom:10px;color:var(--dim)">Tokens let an external Telegram sales bot call the panel API (create/renew users, read usage).</div>
      <div class="row"><div><label>Token name</label><input id="tn" class="in" placeholder="telegram-sales-bot"></div>
      <div style="flex:0"><button class="btn" onclick="addToken()">+ Create token</button></div></div></div>
    <table><thead><tr><th>Name</th><th>Scopes</th><th>Created</th><th></th></tr></thead>
    <tbody>${rows||'<tr><td colspan=4 style="color:var(--dim)">No tokens yet</td></tr>'}</tbody></table>`;
}
async function addToken(){try{
  const r=await api('POST','/api/tokens',{name:$('#tn').value||'bot'});
  renderTokens();
  prompt('Copy this token now — it is shown only once:',r.secret);
}catch(e){toast(e.message)}}
async function delToken(id){if(!confirm('Delete token?'))return;await api('DELETE','/api/tokens/'+id);renderTokens()}

function renderSettings(){
  $('#content').innerHTML=`<div class="card" style="max-width:520px">
      <div style="font-size:14px;font-weight:600;margin-bottom:4px">Admin account</div>
      <div style="color:var(--dim);font-size:12px;margin-bottom:14px">Change your panel username and password. Your current password is required.</div>
      <label>Current password</label><input id="cp" class="in" type="password" style="margin-bottom:12px">
      <label>New username (optional)</label><input id="nus" class="in" placeholder="leave blank to keep" style="margin-bottom:12px">
      <label>New password (optional, min 6)</label><input id="nps" class="in" type="password" placeholder="leave blank to keep" style="margin-bottom:16px">
      <button class="btn" onclick="changeAccount()">Save changes</button>
      <div id="serr" style="font-size:12px;margin-top:10px"></div>
    </div>
    <div class="card" style="max-width:520px;margin-top:14px">
      <div style="font-size:14px;font-weight:600;margin-bottom:4px">Telegram bot</div>
      <div style="color:var(--dim);font-size:12px;margin-bottom:14px">Manage users and get quota/expiry alerts from Telegram. Create a bot with <b>@BotFather</b> to get a token, then message your bot <b>/id</b> to learn your chat ID and put it below. <span id="tgstate"></span></div>
      <label>Bot token</label><input id="tgtok" class="in" placeholder="leave blank to keep current, or 123456:ABC..." style="margin-bottom:12px">
      <label>Admin chat IDs (comma-separated)</label><input id="tgadm" class="in" placeholder="111111111,222222222" style="margin-bottom:14px">
      <button class="btn" onclick="saveTelegram()">Save Telegram settings</button>
      <div id="tgerr" style="font-size:12px;margin-top:10px"></div>
    </div>
    <div class="card" style="max-width:520px;margin-top:14px">
      <div style="font-size:14px;font-weight:600;margin-bottom:4px">Backup &amp; data</div>
      <div style="color:var(--dim);font-size:12px;margin-bottom:14px">Download a complete snapshot of the panel database (users, inbounds, nodes, tokens). Keep it somewhere safe; to restore, replace the panel's .db file with it.</div>
      <button class="btn" onclick="downloadBackup()">⬇ Download backup</button>
    </div>`;
  loadTelegram();
}
async function loadTelegram(){
  try{const t=await api('GET','/api/telegram');
    $('#tgstate').innerHTML = t.configured?('Bot configured (token '+esc(t.token_hint)+'). ✅'):'No token set yet.';
    $('#tgadm').value=t.admin_ids||'';
  }catch(e){}
}
async function saveTelegram(){
  const body={admin_ids:$('#tgadm').value};
  const tok=$('#tgtok').value.trim(); if(tok) body.token=tok;
  try{await api('POST','/api/telegram',body);
    $('#tgerr').style.color='var(--ok)';$('#tgerr').textContent='Saved. The bot picks up changes within ~15s.';
    $('#tgtok').value='';loadTelegram();
  }catch(e){$('#tgerr').style.color='var(--bad)';$('#tgerr').textContent=e.message}
}
async function downloadBackup(){
  try{
    const r=await fetch('/api/backup',{credentials:'same-origin'});
    if(!r.ok) throw new Error('backup failed');
    const b=await r.blob(), u=URL.createObjectURL(b), a=document.createElement('a');
    const cd=r.headers.get('Content-Disposition')||'', m=cd.match(/filename="([^"]+)"/);
    a.href=u; a.download=m?m[1]:'rahro-backup.db'; a.click(); URL.revokeObjectURL(u);
  }catch(e){toast('Backup failed')}
}
async function changeAccount(){
  const body={current_password:$('#cp').value,new_username:$('#nus').value,new_password:$('#nps').value};
  try{
    const r=await api('POST','/api/account',body);
    $('#who').textContent=r.username;
    $('#serr').style.color='var(--ok)';$('#serr').textContent='Saved. Username is now "'+r.username+'".';
    $('#cp').value='';$('#nus').value='';$('#nps').value='';
  }catch(e){$('#serr').style.color='var(--bad)';$('#serr').textContent=e.message}
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

// Auto-enter the app if already authenticated.
(async()=>{try{const m=await api('GET','/api/me');$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#who').textContent=m.username;show('dash')}catch(e){showLogin()}})();
</script>
</body>
</html>
